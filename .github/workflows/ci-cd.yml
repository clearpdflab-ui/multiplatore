name: Build and Deploy Multiplatore

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run typecheck

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # NOTE: nessun job "deploy": la pubblicazione avviene via Git integration di
  # Vercel (push -> build automatico sul progetto rcsitalia/multiplatore).
  # Il vecchio job usava amondnet/vercel-action@v30 (release inesistente) ed era
  # comunque sempre rimasto bloccato sul test job rosso dal 2026-09-07.
